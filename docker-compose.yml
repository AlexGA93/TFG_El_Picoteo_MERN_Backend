services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env.production
    ports:
      - ${NODE_LOCAL_PORT}:${NODE_DOCKER_PORT}
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:'+process.env.NODE_DOCKER_PORT+'/', (res) => process.exit(res.statusCode===200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysqldb:
    image: mirror.gcr.io/library/mysql:8.0-debian
    env_file:
      - ./.env.production
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - ${MYSQL_LOCAL_PORT}:${MYSQL_DOCKER_PORT}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      default:
        aliases:
          - mysqldb

networks:
  default:
    driver: bridge

volumes:
  mysql-data:
