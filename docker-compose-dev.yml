# services (containers)
services:
  server:
  # where is the app (context) to work with
    build:
      context: .
      # use dockerfile for development 
      dockerfile: Dockerfile.dev
    ports:
      - $NODE_LOCAL_PORT:$NODE_DOCKER_PORT
    depends_on:
      mysqldb:
        condition: service_healthy
    volumes:
      - .:/home/app
      - server-node-modules:/home/app/node_modules

  # MySQL container named as 'mysqldb'
  mysqldb:
    # MySQL image
    image: mirror.gcr.io/library/mysql:8.0.45
    # environment variables from .env file
    env_file:
      - ./.env
    restart: always
    # MySQL configuration
    environment:
      - MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE=$MYSQL_DATABASE
    # ports - pc_port:internal_docker_port
    ports:
      - $MYSQL_LOCAL_PORT:$MYSQL_DOCKER_PORT
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql
networks:
  default:
    driver: bridge

volumes:
  mysql-data:
  server-node-modules:

